name = "route-planner-matrix"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
# No per-version preview URLs: they would be extra public endpoints using the same key.
preview_urls = false

# No request logs/observability: requests carry coordinates of visit locations.
[observability]
enabled = false

[vars]
ALLOWED_ORIGINS = "https://shmulik158-design.github.io,http://localhost:5173"

# Secret (not in this file):  npx wrangler secret put GOOGLE_API_KEY
